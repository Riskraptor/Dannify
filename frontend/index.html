<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Dannify</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #08080a;
      }
      html[data-theme='dannify-light'],
      html[data-theme='dannify-light'] body {
        background: #e7e9ed;
      }
    </style>
    <script>
      // Apply the saved theme before first paint (no flash).
      ;(function () {
        try {
          var pref = localStorage.getItem('dn.theme') || 'system'
          var dark =
            pref === 'dark' ||
            (pref !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute(
            'data-theme',
            dark ? 'dannify-dark' : 'dannify-light'
          )
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dannify-dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
