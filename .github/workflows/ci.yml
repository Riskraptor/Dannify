# Every push and pull request: the backend tests, the interface tests, a
# build of the interface and the installer program, and of the Android app.
# Nothing here signs or publishes anything; releases are signed with keys
# that never leave the release machine (packaging/publish.ps1).
name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read
  # gh run download, for what the Android native jobs of the run built.
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# actions/checkout makes the repository with `git init`, and git then printed
# a hint about the name of the first branch in every job.
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  backend:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      # The gateway test starts the real app, which serves the built
      # interface: it needs frontend/dist to exist.
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the interface
        working-directory: frontend
        run: |
          npm ci
          npx vite build
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider

  # The same tests on Linux and macOS: the shared code, and each platform's
  # own (key store, folders, update files, the macOS updater). No window.
  backend-unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the interface
        working-directory: frontend
        run: |
          npm ci
          npx vite build
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The same Node (and npm) the lock file is written with: an older
          # npm reads it differently and refuses to install from it.
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npx vite build
      # What every start reads before anything is drawn: it may only grow on
      # purpose (see the script for the limits).
      - name: Size budget
        run: node scripts/size-budget.mjs

  installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Build and check the installer, unsigned and code-signed
        shell: pwsh
        run: ./packaging/test_installer.ps1

  # What the Android app carries that is built for Android (cached: only
  # built again when its scripts change), then the app itself, for the
  # emulator and for phones.
  android-native:
    uses: ./.github/workflows/android-native.yml

  android:
    needs: android-native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Java
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the interface
        working-directory: frontend
        run: |
          npm ci
          npx vite build
      - name: What is built for Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.run_id }} --repo ${{ github.repository }} --name android-native --dir android/native
      - name: Gradle's downloads (cached)
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Build the app
        working-directory: android
        env:
          DANNIFY_BUILD_PYTHON: python
        run: ./gradlew --no-daemon --console=plain assembleX86_64Debug assembleArm64Debug
