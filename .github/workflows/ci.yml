# Every push and pull request: the backend tests, the interface tests and a
# build of the interface and the installer program. Nothing here signs or
# publishes anything; releases are built with packaging\build.ps1, which
# signs with a key that never leaves the release machine.
name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      # The gateway test starts the real app, which serves the built
      # interface: it needs frontend/dist to exist.
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the interface
        working-directory: frontend
        run: |
          npm ci
          npx vite build
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider

  # The same tests on Linux and macOS: the shared code, and each platform's
  # own (key store, folders, update files, the macOS updater). No window.
  backend-unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the interface
        working-directory: frontend
        run: |
          npm ci
          npx vite build
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The same Node (and npm) the lock file is written with: an older
          # npm reads it differently and refuses to install from it.
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npx vite build

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build and check the installer, unsigned and code-signed
        shell: pwsh
        run: ./packaging/test_installer.ps1
