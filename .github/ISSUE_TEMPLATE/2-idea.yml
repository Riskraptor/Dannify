name: An idea
description: Something Dannify could do, or do better.
labels: [idea]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like to do?
      placeholder: "I'd like to …"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What it would make easier. The "why" is what makes an idea easy to build well.
    validations:
      required: true
